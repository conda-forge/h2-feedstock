# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "4.4.0"
  python_check_max: "3.14"

package:
  name: h2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/h2/h2-${{ version }}.tar.gz
  sha256: 46b551bdcdc7e83cf5c04d0bf93badb8a939bd2287d9fee1abb23a445b9e0580

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - hyperframe >=6.1,<7
    - hpack >=4.2,<5

tests:
  - python:
      imports: h2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pytest-cov
        - hypothesis
    files:
      source:
        - tests/
    script:
      - coverage run --source=h2 --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=99

about:
  license: MIT
  license_file: LICENSE
  summary: HTTP/2 State-Machine based protocol implementation
  homepage: https://pypi.org/project/h2
  repository: https://github.com/python-hyper/h2
  documentation: https://python-hyper.org

extra:
  recipe-maintainers:
    - primozgodec
    - wiphoo
    - bollwyvl
